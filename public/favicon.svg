<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Orbital Ring -->
  <g transform="rotate(-28 50 50)">
    <ellipse cx="50" cy="50" rx="42" ry="15" fill="none" stroke="url(#favGrad)" stroke-width="3" />
    <circle cx="92" cy="50" r="4" fill="#00f2fe" />
  </g>

  <!-- Compass Star North -->
  <polygon points="50,4 60,50 50,43" fill="#00f2fe" />
  <polygon points="50,4 40,50 50,43" fill="#0284c7" />

  <!-- Compass Star South -->
  <polygon points="50,96 60,50 50,57" fill="#1e40af" />
  <polygon points="50,96 40,50 50,57" fill="#172554" />

  <!-- Compass Star East -->
  <polygon points="96,50 50,60 57,50" fill="#38bdf8" />
  <polygon points="96,50 50,40 57,50" fill="#1d4ed8" />

  <!-- Compass Star West -->
  <polygon points="4,50 50,40 43,50" fill="#38bdf8" />
  <polygon points="4,50 50,60 43,50" fill="#0284c7" />

  <!-- Center Core -->
  <circle cx="50" cy="50" r="8" fill="#070a13" stroke="#00f2fe" stroke-width="2.5" />
  <circle cx="50" cy="50" r="3.5" fill="#ffffff" />
</svg>
