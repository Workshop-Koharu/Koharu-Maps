<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Vibrant Blue & Cyan Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="secondaryGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Orbital Ring (Tilted 30 deg) -->
  <g transform="rotate(-28 50 50)">
    <ellipse cx="50" cy="50" rx="42" ry="15" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" opacity="0.85" />
    <circle cx="92" cy="50" r="3.5" fill="#00f2fe" filter="url(#glow)" />
    <circle cx="8" cy="50" r="2" fill="#38bdf8" />
  </g>

  <!-- Inner Geodetic Calibration Ring -->
  <circle cx="50" cy="50" r="26" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6" />

  <!-- Diagonal Compass Rays -->
  <polygon points="50,50 68,32 50,42" fill="#60a5fa" opacity="0.75" />
  <polygon points="50,50 68,32 58,50" fill="#3b82f6" opacity="0.75" />
  <polygon points="50,50 68,68 58,50" fill="#2563eb" opacity="0.75" />
  <polygon points="50,50 68,68 50,58" fill="#1d4ed8" opacity="0.75" />
  <polygon points="50,50 32,68 50,58" fill="#1e40af" opacity="0.75" />
  <polygon points="50,50 32,68 42,50" fill="#2563eb" opacity="0.75" />
  <polygon points="50,50 32,32 42,50" fill="#3b82f6" opacity="0.75" />
  <polygon points="50,50 32,32 50,42" fill="#60a5fa" opacity="0.75" />

  <!-- Main 4-Point Compass Star -->
  <!-- North Needle (Bright Electric Cyan) -->
  <polygon points="50,6 59,50 50,44" fill="url(#primaryGrad)" filter="url(#glow)" />
  <polygon points="50,6 41,50 50,44" fill="#0284c7" />

  <!-- South Needle -->
  <polygon points="50,94 59,50 50,56" fill="#1e3a8a" />
  <polygon points="50,94 41,50 50,56" fill="#172554" />

  <!-- East Needle -->
  <polygon points="94,50 50,59 56,50" fill="url(#secondaryGrad)" />
  <polygon points="94,50 50,41 56,50" fill="#1e40af" />

  <!-- West Needle -->
  <polygon points="6,50 50,41 44,50" fill="#38bdf8" />
  <polygon points="6,50 50,59 44,50" fill="#0284c7" />

  <!-- Central Precision Core Pivot -->
  <circle cx="50" cy="50" r="7.5" fill="#070a13" stroke="#00f2fe" stroke-width="2.5" />
  <circle cx="50" cy="50" r="3.2" fill="#ffffff" />
</svg>
