<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="kg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Polygon Shield -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#bgGlow)" stroke="#334155" stroke-width="2.5" />

  <!-- Geodetic Grid Lat/Lon Circles -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6" />
  <ellipse cx="50" cy="50" rx="18" ry="34" fill="none" stroke="#475569" stroke-width="1.2" opacity="0.5" />
  <line x1="16" y1="50" x2="84" y2="50" stroke="#475569" stroke-width="1.2" opacity="0.5" />

  <!-- Geometric Cartographic Compass Needle -->
  <!-- North Arrow (Blue Gradient) -->
  <polygon points="50,18 61,48 50,43" fill="url(#kg)" />
  <polygon points="50,18 39,48 50,43" fill="#1d4ed8" />

  <!-- South Arrow (Slate/White) -->
  <polygon points="50,82 61,52 50,57" fill="#64748b" />
  <polygon points="50,82 39,52 50,57" fill="#475569" />

  <!-- Central Pivot Ring -->
  <circle cx="50" cy="50" r="5.5" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="50" cy="50" r="2" fill="#ffffff" />

  <!-- Cardinal Markers -->
  <circle cx="50" cy="12" r="2" fill="#38bdf8" />
  <circle cx="88" cy="50" r="1.5" fill="#64748b" />
  <circle cx="50" cy="88" r="1.5" fill="#64748b" />
  <circle cx="12" cy="50" r="1.5" fill="#64748b" />
</svg>
