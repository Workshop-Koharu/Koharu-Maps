<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <filter id="favShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <linearGradient id="favPinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff453a" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="favFold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <g filter="url(#favShadow)">
    <!-- Left Panel -->
    <polygon points="6,15 24,9 24,53 6,47" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8" />
    <path d="M 6,32 Q 15,28 24,35 L 24,45 L 6,41 Z" fill="#38bdf8" />
    <path d="M 6,24 L 24,30" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />

    <!-- Center Panel (Valley Fold) -->
    <polygon points="24,9 42,15 42,59 24,53" fill="#e2e8f0" stroke="#64748b" stroke-width="0.8" />
    <polygon points="24,9 42,15 42,59 24,53" fill="url(#favFold)" />
    <path d="M 24,35 Q 33,40 42,33 L 42,42 Q 33,49 24,45 Z" fill="#38bdf8" />
    <path d="M 24,30 Q 33,34 42,28" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />

    <!-- Right Panel -->
    <polygon points="42,15 58,9 58,47 42,59" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8" />
    <path d="M 42,33 Q 50,26 58,30 L 58,40 L 42,52 Z" fill="#38bdf8" />
    <path d="M 42,28 L 58,22" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />

    <!-- Mac Pin Teardrop Marker -->
    <path d="M 38,16 C 32,16 27,21 27,27 C 27,35 38,47 38,47 C 38,47 49,35 49,27 C 49,21 44,16 38,16 Z"
          fill="url(#favPinGrad)" stroke="#b91c1c" stroke-width="0.8" />
    <circle cx="38" cy="26" r="3.8" fill="#ffffff" />
  </g>
</svg>
